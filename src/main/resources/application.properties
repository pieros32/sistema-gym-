spring.application.name=iron-legacy

# Red: escucha en todas las interfaces para que otras PCs de la red usen el sistema (RNF-06).
server.address=${SERVIDOR_DIRECCION:0.0.0.0}
server.port=${PUERTO:8080}

# Conexión a MySQL. La clave no tiene valor por defecto: se pasa por variable de entorno.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/iron_legacy?serverTimezone=America/Lima&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USUARIO:iron_legacy}
spring.datasource.password=${DB_CLAVE}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.thymeleaf.cache=false
